<style>
  :root{
    --bg:#FFFFFF; --bg-card:#F7F5EF; --bg-elevated:#EFEADD;
    --gold:#B8860B; --gold-deep:#96690A; --blue:#1D4E89; --blue-deep:#163B69;
    --coral:#B3432D;
    --text:#20242B; --text-dim:#6B7280; --line:#E4E0D4;

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; min-height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif; overscroll-behavior:none; }
  .num{ font-variant-numeric:tabular-nums; }
  .neg-amt{ color:#E5231B !important; }
  #app{ max-width:560px; margin:0 auto; padding:0 0 128px; min-height:100vh; position:relative; }

  .topbar{ position:sticky; top:0; z-index:10; background:var(--bg); padding:12px 12px 6px; border-bottom:1px solid var(--line); }
  .tb-row{ display:flex; align-items:stretch; gap:7px; min-width:0; }
  .tb-half{ flex:1 1 50%; min-width:0; display:flex; align-items:center; }

  .project-switch{ display:flex; align-items:center; gap:6px; background:var(--bg-card); border-radius:12px; padding:10px 11px; cursor:pointer; border:1px solid var(--line); width:100%; min-width:0; }
  .project-switch .name{ font-size:14.5px; font-weight:700; color:var(--blue-deep); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1 1 auto; }
  .proj-date-inline{ font-size:10.5px; color:var(--text-dim); font-weight:600; flex:none; border-left:1px solid var(--line); padding-left:6px; margin-left:2px; }
  .project-switch .chev{ color:var(--text-dim); font-size:12px; margin-left:auto; flex:none; }
  .icon-btn{ width:36px; height:36px; border-radius:10px; background:var(--bg-card); border:1px solid var(--line); color:var(--blue-deep); font-size:14px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none; }

  .view-toggle{ display:flex; gap:3px; background:var(--bg-card); border-radius:9px; padding:2px; border:1px solid var(--line); width:100%; height:36px; }
  .view-toggle button{ flex:1; border:none; background:transparent; padding:0 3px; font-size:11px; font-weight:700; color:var(--text-dim); border-radius:7px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .view-toggle button.active{ background:var(--blue-deep); color:#fff; }
  .cur-toggle{ display:flex; gap:3px; background:var(--bg-card); border-radius:9px; padding:2px; border:1px solid var(--line); flex:none; height:36px; }
  .cur-toggle button{ border:none; background:transparent; padding:0 7px; font-size:10px; font-weight:700; color:var(--text-dim); border-radius:6px; cursor:pointer; }
  .cur-toggle button.active{ background:var(--gold); color:#fff; }

  .rate-row{ display:flex; align-items:center; gap:6px; width:100%; }
  .rate-icon-btn{ width:36px; height:36px; border-radius:10px; border:1px solid var(--gold-deep); background:#FFF3D6; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; flex:none; line-height:1.15; gap:0; padding:0 2px; text-align:center; }
  .rate-icon-btn .ri-ic{ font-size:8px; color:var(--gold-deep); font-weight:700; }
  .rate-icon-btn .ri-val{ font-size:12px; font-weight:800; color:var(--gold-deep); }
  .tr2-total{ width:100%; text-align:right; background:var(--blue-deep); border-radius:10px; padding:7px 12px; }
  .tr2-total .tr2-label{ display:block; font-size:8.5px; color:#DCE6F2; text-transform:uppercase; letter-spacing:0.3px; }
  .tr2-total .tr2-val{ display:block; font-size:16px; font-weight:800; color:#F5C15C; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .list-area{ padding:10px 10px 0; }
  .group-block{ margin-bottom:12px; border:1px solid var(--line); border-radius:11px; overflow:hidden; }
  .group-head{ background:var(--blue-deep); color:#fff; font-size:10px; font-weight:700; padding:3px 10px; letter-spacing:0.2px; }
  table.entries-table{ width:100%; border-collapse:collapse; background:#fff; }
  table.entries-table td{ padding:8px 10px; font-size:13px; border-bottom:1px solid var(--line); vertical-align:top; }
  table.entries-table tr:last-child td{ border-bottom:none; }
  table.entries-table tr:nth-child(even){ background:#FBFAF6; }

  td.col-opis .meta{ display:block; font-size:10.5px; font-weight:400; color:var(--text-dim); margin-top:1px; }
  td.col-amt{ text-align:right; white-space:nowrap; font-weight:700; }
  td.col-amt .sub{ display:block; font-size:10px; font-weight:400; color:var(--text-dim); }
  tr.total-row td{ background:#FFF8E8; font-weight:800; color:var(--gold-deep); font-size:12.5px; padding:7px 10px; }

  #statusBanner.info{ background:#163B69; color:#fff; }
  #statusBanner .closeBtn{ margin-left:auto; flex:none; background:none; border:none; color:#fff; font-size:16px; cursor:pointer; opacity:0.8; }
  #undoToast{
    position:fixed; left:14px; right:14px; bottom:172px; max-width:532px; margin:0 auto; z-index:45;
    background:#20242B; color:#fff; border-radius:12px; padding:11px 14px;
    display:none; align-items:center; justify-content:space-between; gap:10px;

  .settings-row{ display:flex; align-items:center; gap:10px; padding:14px; border-bottom:1px solid var(--line); cursor:pointer; background:none; border-left:none; border-right:none; border-top:none; width:100%; text-align:left; font-family:inherit; }
  .settings-row:last-child{ border-bottom:none; }
  .settings-row:active{ background:var(--bg-elevated); }
  .settings-row .row-icon{ font-size:16px; flex:none; width:20px; text-align:center; }
  .settings-row .row-label{ flex:1; font-size:14px; font-weight:600; color:var(--text); }
  .settings-row .chevron{ color:var(--text-dim); font-size:13px; flex:none; }
  .settings-danger-row{ color:var(--coral); }

  .settings-hint{ font-size:11px; color:var(--text-dim); padding:8px 4px 0; line-height:1.5; }
  .field{ margin-bottom:14px; }
  .field label{ font-size:13px; color:var(--text-dim); display:block; margin-bottom:6px; }
  .field input, .field select{ width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--bg-card); color:var(--text); font-size:15px; font-family:inherit; }
  .date-trio{ display:flex; gap:7px; }
  .date-trio input{ text-align:center; padding:12px 4px; border-radius:10px; border:1px solid var(--line); background:var(--bg-card); color:var(--text); font-size:15px; font-family:inherit; }

  .modal-actions{ display:flex; gap:10px; margin-top:6px; }
  .modal-actions button{ flex:1; padding:14px; border-radius:12px; border:none; font-size:15px; font-weight:700; cursor:pointer; }
  .cancel-btn{ background:var(--bg-card); color:var(--text); border:1px solid var(--line); }
  .create-btn{ background:var(--blue-deep); color:#fff; }
  .delete-btn{ background:var(--coral); color:#fff; }
</style>
</head>

function foldDiacritics(s){
  if(!s) return '';
  return s.toLowerCase()
    .replace(/[čć]/g,'c')
    .replace(/š/g,'s')
    .replace(/ž/g,'z')
    .replace(/đ/g,'dj');
}
function toggleSearch(){
  const wasOpen = searchOpen;
  searchOpen = !searchOpen;
  if(!searchOpen){ searchQuery=''; }
  render();
  if(searchOpen){
    try{ history.pushState({searchOpen:true}, '', location.href); }catch(e){}
    setTimeout(()=>{ const el=document.getElementById('searchInput'); if(el) el.focus(); },100);
  } else if(wasOpen && window.history.state && window.history.state.searchOpen){
    try{ history.back(); }catch(e){}
  }
}
function setSearchQuery(v){
  searchQuery = v;
  const cursorPos = v.length;
  render();
  const el = document.getElementById('searchInput');
  if(el){ el.focus(); try{ el.setSelectionRange(cursorPos, cursorPos); }catch(e){} }
}

  const proj = currentProject();
  const setting = proj ? proj.language : 'auto';
  if(setting && setting !== 'auto') return setting;
  const nav = (navigator.language || 'en').toLowerCase();
  return nav.startsWith('sr') ? 'sr-RS' : 'en-US';

function t(key){
  const lang = resolveAppLanguage();
  return (I18N[lang] && I18N[lang][key]) || (I18N['sr-RS'] && I18N['sr-RS'][key]) || key;
}

function uid(p){ return p+Date.now()+Math.random().toString(36).slice(2,7); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dmFromISO(iso){ const [y,m,d]=iso.split('-'); return d+'.'+m; }
function dmyFromISO(iso){ const [y,m,d]=iso.split('-'); return d+'.'+m+'.'+y; }
function dmyFromTimestamp(ts){
  const d = new Date(ts);
  return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();
}
function isoFromParts(d,m,y){ return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
function fmtNum(n){ return (Math.round(n*100)/100).toLocaleString('sr-RS',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtAmt(n){ const s=fmtNum(n); return n<0 ? '<span class="neg-amt">'+s+'</span>' : s; }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
let bannerTimeout = null;
function showBanner(msg, type){
  type = type || 'error';
  const b = document.getElementById('statusBanner');
  b.className = 'show ' + type;
  b.innerHTML = '<span>'+escapeHtml(msg)+'</span><button class="closeBtn" onclick="hideBanner()">✕</button>';
  clearTimeout(bannerTimeout);
  bannerTimeout = setTimeout(hideBanner, 8000);
}
function hideBanner(){
  const b = document.getElementById('statusBanner');
  if(b){ b.className=''; }
  clearTimeout(bannerTimeout);
}

let lastDeleted = null;
let undoTimeout = null;
function showUndoToast(message){
  const t = document.getElementById('undoToast');
  if(!t) return;
  t.className = 'show';
  t.innerHTML = '<span>'+escapeHtml(message)+'</span><button onclick="performUndo()">Poništi</button>';
  clearTimeout(undoTimeout);
  undoTimeout = setTimeout(hideUndoToast, 6000);
}
function hideUndoToast(){
  const t = document.getElementById('undoToast');
  if(t) t.className = '';
  clearTimeout(undoTimeout);
  lastDeleted = null;
}
function performUndo(){
  if(!lastDeleted) return;
  if(lastDeleted.type === 'entry'){
    if(lastDeleted.projectId === currentProjectId){
      entries.push(lastDeleted.entry);
      persistEntries();
    } else {
      const e = lsGet('entries:'+lastDeleted.projectId);
      let arr = (e && e.value) ? JSON.parse(e.value) : [];
      arr.push(lastDeleted.entry);
      lsSet('entries:'+lastDeleted.projectId, JSON.stringify(arr));
    }
  } else if(lastDeleted.type === 'project'){
    projects.push(lastDeleted.project);
    persistProjects();
    lsSet('entries:'+lastDeleted.project.id, JSON.stringify(lastDeleted.entries));
    lsSet('rates:'+lastDeleted.project.id, JSON.stringify(lastDeleted.rates));
  }
  const t = document.getElementById('undoToast');
  if(t) t.className = '';
  clearTimeout(undoTimeout);
  lastDeleted = null;
  render();
  showBanner(t('restored'), 'info');
}



/* ---------- PERSISTENCE (localStorage - radi trajno u Chrome-u) ---------- */
function lsGet(key){ try{ const v = localStorage.getItem(key); return v===null ? null : {value:v}; }catch(e){ return null; } }
function lsSet(key,val){ try{ localStorage.setItem(key, val); return {value:val}; }catch(e){ return null; } }
function lsDelete(key){ try{ localStorage.removeItem(key); }catch(e){} }

async function loadAll(){
  const p = lsGet('app:projects');
  if(p && p.value){ try{ projects = JSON.parse(p.value); }catch(e){ projects=[]; } }
  const l = lsGet('app:lastProjectId');
  if(l && l.value) currentProjectId = l.value;

  if(projects.length === 0){
    const np = { id: uid('p'), name: t('default_project_name'), language:'auto', displayCurrency:null, activeDate: todayISO(), createdAt: Date.now() };
    projects.push(np);
    currentProjectId = np.id;
    persistProjects();
    persistLastProject();
  }
  if(!currentProjectId || !projects.find(pr=>pr.id===currentProjectId)) currentProjectId = projects[0].id;
  const today = todayISO();
  let anyDateReset = false;
  projects.forEach(pr=>{
    if(!pr.activeDate || pr.activeDate !== today){ pr.activeDate = today; anyDateReset = true; }
  });
  if(anyDateReset) persistProjects();
  loadProjectData(currentProjectId);
  render();
}
function persistProjects(){ lsSet('app:projects', JSON.stringify(projects)); }
function persistLastProject(){ lsSet('app:lastProjectId', currentProjectId); }
function loadProjectData(pid){
  const e = lsGet('entries:'+pid);
  entries = (e && e.value) ? JSON.parse(e.value) : [];
  const r = lsGet('rates:'+pid);
  rates = (r && r.value) ? JSON.parse(r.value) : {};
}
function persistEntries(){ lsSet('entries:'+currentProjectId, JSON.stringify(entries)); }
function persistRates(){ lsSet('rates:'+currentProjectId, JSON.stringify(rates)); }
function getApiKey(){ const k = lsGet('app:apiKey'); return k ? k.value : ''; }
function setApiKey(key){ lsSet('app:apiKey', key); }

/* ---------- CURRENCY ---------- */
function currentProject(){ return projects.find(p=>p.id===currentProjectId); }
function currencyPair(){
  const proj = currentProject();
  if(proj && Array.isArray(proj.currencyPair) && proj.currencyPair.length===2) return proj.currencyPair;
  return ['RSD','EUR'];
}
function setCurrencyPair(curA, curB){
  const proj = currentProject();
  if(!proj) return;
  proj.currencyPair = [curA, curB];
  if(proj.displayCurrency && proj.displayCurrency!==curA && proj.displayCurrency!==curB){
    proj.displayCurrency = null;
  }
  persistProjects();
  closeModal();
  render();
}
function usedCurrencies(){
  // tacno dve valute po projektu - biras ih kao na menjacnici
  return currencyPair().slice();
}
function displayCurrency(){
  const proj = currentProject();
  const used = usedCurrencies();
  if(proj && proj.displayCurrency && used.includes(proj.displayCurrency)) return proj.displayCurrency;
  return used[0];
}
function setDisplayCurrency(cur){
  const proj = currentProject();
  if(proj){ proj.displayCurrency = cur; persistProjects(); render(); }
}
function pairKey(a,b){ return [a,b].sort().join('_'); }
function convert(amount, fromCur, toCur){
  if(fromCur===toCur) return amount;
  const key = pairKey(fromCur, toCur);
  const rate = rates[key];
  if(!rate) return null;
  const [a] = key.split('_');
  return fromCur===a ? amount*rate : amount/rate;
}
function getLastGlobalRates(){
  const r = lsGet('app:lastRates');
  return (r && r.value) ? JSON.parse(r.value) : {};
}
function saveLastGlobalRate(key, val){
  const all = getLastGlobalRates();
  all[key] = val;
  lsSet('app:lastRates', JSON.stringify(all));
}
function setRate(curA, curB, val){
  const v = parseFloat(val);
  if(!isNaN(v) && v>0){
    const key = pairKey(curA,curB);
    rates[key]=v; persistRates();
    saveLastGlobalRate(key, v);
    closeModal(); render();
  }
}
function knownCategories(){
  const seen = new Set();
  const result = [];
  for(let i=entries.length-1; i>=0 && result.length<15; i--){
    const k = entries[i].kategorija;
    if(k && !seen.has(k)){ seen.add(k); result.push(k); }
  }
  return result;
}

/* ---------- PROJECT ACTIONS ---------- */
function switchProject(pid){
  currentProjectId = pid; persistLastProject(); loadProjectData(pid);
  const proj = projects.find(p=>p.id===pid);
  const today = todayISO();
  if(proj && proj.activeDate !== today){ proj.activeDate = today; persistProjects(); }
  closeModal(); render();
}
function createProject(name, language){
  const np = { id: uid('p'), name: name || t('default_project_name'), language: language||'auto', displayCurrency:null, activeDate: todayISO(), createdAt: Date.now() };
  projects.push(np); persistProjects(); switchProject(np.id);
}
function deleteProject(pid){
  const proj = projects.find(p=>p.id===pid);
  if(proj){
    const e = lsGet('entries:'+pid);
    const r = lsGet('rates:'+pid);
    lastDeleted = {
      type: 'project',
      project: JSON.parse(JSON.stringify(proj)),
      entries: (e && e.value) ? JSON.parse(e.value) : [],
      rates: (r && r.value) ? JSON.parse(r.value) : {}
    };
  }
  projects = projects.filter(p=>p.id!==pid);
  lsDelete('entries:'+pid);
  lsDelete('rates:'+pid);
  persistProjects();
  if(projects.length===0){ createProject(null,'auto'); }
  else if(currentProjectId===pid){ switchProject(projects[0].id); }
  else { render(); }
  if(proj) showUndoToast('Projekat "'+proj.name+'" obrisan.');
}
function setActiveDate(iso){
  const proj = currentProject();
  if(proj){ proj.activeDate = iso; persistProjects(); render(); }
}

/* ---------- ENTRY ACTIONS ---------- */


function commitEntries(items){
  const proj = currentProject();
  const newIds = [];
  items.forEach(it=>{
    const id = uid('e');
    entries.push({
      id: id, datum: it.datum || proj.activeDate || todayISO(),
      opis: it.opis, iznos: it.iznos, valuta: it.valuta,
      kategorija: it.kategorija || 'Ostalo', napomena: it.napomena || ''
    });
    newIds.push(id);
  });
  persistEntries(); render();
  return newIds;
}
function updateEntry(id, data){
  const e = entries.find(x=>x.id===id); if(!e) return;
  Object.assign(e, data); persistEntries(); render();
}
function deleteEntry(id){
  const e = entries.find(x=>x.id===id);
  if(e){ lastDeleted = { type:'entry', projectId: currentProjectId, entry: JSON.parse(JSON.stringify(e)) }; }
  entries = entries.filter(x=>x.id!==id);
  persistEntries(); render();
  if(e) showUndoToast('Stavka "'+e.opis+'" obrisana.');
}

/* ---------- AI PARSING ---------- */
async function callGeminiForExpenses(contentPart, isAudio, isImage){
  const proj = currentProject();
  const guessCur = entries.length>0 ? entries[entries.length-1].valuta : (displayCurrency() || 'RSD');
  const known = usedCurrencies();
  const knownCats = knownCategories();
  const today = todayISO();
  const audioNote = isAudio ? ' Ovo je audio zapis - prvo ga transkribuj u sebi (bilo koji jezik), zatim izvuci troškove iz izgovorenog.' : '';
  const imageNote = isImage ? ' Ovo je fotografija računa/priznanice. Pročitaj sve stavke sa slike (svaki artikal/uslugu kao posebnu stavku ako je jasno razdvojeno, ili ukupan iznos računa kao jednu stavku ako pojedinačne stavke nisu čitljive). Ako na računu piše naziv prodavnice, koristi ga kao deo opisa. Datum na računu koristi kao "datum" polje ako je čitljiv.' : '';
  const sys = `Danas: ${today}.${audioNote}${imageNote} Izvuci troškove (bilo koji jezik). Vrati SAMO JSON niz, bez markdown, bez ostalog teksta. Svaka stavka: {"opis":kratak opis original jezik, "iznos":broj, "valuta":ISO 3 slova (podrazumevano "${guessCur}" ako nije rečeno), "kategorija":1-2 reči (koristi tačno postojeću ako odgovara: ${knownCats.join(', ') || 'nema'}), "napomena":opciono, "datum":GGGG-MM-DD SAMO ako eksplicitno pomenut (izostavi polje ako nije)}. Više stavki/datuma = više objekata, svaki sa svojim tačnim datumom iz konteksta. Ne prevodi opis. Poznate valute: ${known.join(', ') || 'nema'}.`;

  const apiKey = getApiKey();
  if(!apiKey){ throw new Error('Nije unet Gemini API ključ. Idi u Podešavanja (⚙) i unesi ga.'); }

  const controller = new AbortController();
  const timeoutId = setTimeout(()=>controller.abort(), 20000);
  let resp;
  const __t0 = performance.now();
  const parts = Array.isArray(contentPart) ? contentPart : [contentPart];
  try{
    resp = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key="+encodeURIComponent(apiKey), {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: sys }] },
        contents: [{ role:"user", parts: parts }],
        generationConfig: { responseMimeType: "application/json", maxOutputTokens: 8000 }
      }),
      signal: controller.signal
    });
  } catch(fetchErr){
    if(fetchErr.name === 'AbortError'){
      throw new Error(t('server_timeout'));
    }
    throw new Error(t('cannot_connect_ai') + ' ' + (fetchErr.message || fetchErr));
  } finally {
    clearTimeout(timeoutId);
  }
  window.__lastCallMs = Math.round(performance.now() - __t0);
  if(!resp.ok){
    const errBody = await resp.text();
    throw new Error('Gemini API greška ('+resp.status+'): '+errBody.slice(0,200));
  }
  const data = await resp.json();

  if(data.promptFeedback && data.promptFeedback.blockReason){
    throw new Error('Gemini je blokirao odgovor: ' + data.promptFeedback.blockReason);
  }
  const candidate = data.candidates && data.candidates[0];
  if(!candidate){
    throw new Error('Gemini nije vratio nijedan rezultat. Sirov odgovor: ' + JSON.stringify(data).slice(0,300));
  }
  if(candidate.finishReason && candidate.finishReason !== 'STOP'){
    throw new Error('Gemini je prekinuo odgovor (' + candidate.finishReason + '). Probaj kraću/jasniju rečenicu.');
  }

  const raw = (candidate.content && candidate.content.parts && candidate.content.parts[0] && candidate.content.parts[0].text) || '';
  if(!raw.trim()){
    throw new Error('Gemini je vratio prazan odgovor. Sirovo: ' + JSON.stringify(data).slice(0,300));
  }
  let items;
  try{ items = JSON.parse(raw); }catch(e){ throw new Error('Ne mogu da protumačim odgovor kao JSON: ' + raw.slice(0,200)); }
  if(!Array.isArray(items)) items = [items];
  return items.filter(it=>it && it.opis).map(it=>({
    opis: it.opis, iznos: parseFloat(it.iznos)||0,
    valuta: (it.valuta||guessCur||'RSD').toUpperCase(),
    kategorija: it.kategorija || 'Ostalo',
    napomena: it.napomena||'', datum: it.datum || null
  }));
}

async function parseWithAI(text){
  return callGeminiForExpenses({ text: text }, false);
}
async function parseImageWithAI(dataUrl, caption){
  const match = /^data:([^;]+);base64,(.*)$/s.exec(dataUrl);
  if(!match) throw new Error('Neispravan format slike.');
  const mimeType = match[1];
  const base64Data = match[2];
  const parts = [{ inlineData: { mimeType: mimeType, data: base64Data } }];
  if(caption && caption.trim()) parts.push({ text: caption.trim() });
  return callGeminiForExpenses(parts, false, true);
}

function findDuplicateEntry(item){
  const proj = currentProject();
  const datum = item.datum || (proj ? proj.activeDate : todayISO());
  const opisNorm = (item.opis||'').trim().toLowerCase();
  return entries.find(e =>
    e.datum === datum &&
    e.valuta === item.valuta &&
    Math.abs(e.iznos - item.iznos) < 0.005 &&
    e.opis.trim().toLowerCase() === opisNorm
  );
}
async function handleIncomingItems(parseFn){
  isProcessing = true; render();
  refocusInput();
  let items;
  try{ items = await parseFn(); }
  catch(e){ isProcessing=false; render(); refocusInput(); showBanner(e && e.message ? e.message : t('ai_processing_error')); return; }
  isProcessing = false;
  if(items.length===0){ render(); refocusInput(); showBanner(t('ai_no_items_recognized')); return; }
  if(items.length===1){
    const dup = findDuplicateEntry(items[0]);
    if(dup){
      render();
      showConfirmModal(
        'Već postoji "'+dup.opis+' '+fmtNum(dup.iznos)+' '+dup.valuta+'" na '+dmFromISO(dup.datum)+'. Dodati ponovo, ili je ovo greška?',
        ()=>{ startPendingSingle(items[0]); },
        'Dodaj ipak', 'Otkaži', 'create-btn'
      );
      return;
    }
    startPendingSingle(items[0]);
  } else {
    const dupCount = items.filter(it=>findDuplicateEntry(it)).length;
    if(dupCount>0){
      render();
      const msg = dupCount===items.length
        ? ('Svih '+dupCount+' prepoznatih stavki već postoji u projektu (obeleženo ispod). Dodati ih ipak, ili je ovo greška?')
        : (dupCount+' od '+items.length+' prepoznatih stavki već postoji u projektu (obeleženo crveno ispod). Dodati sve ipak, ili je ovo greška?');
      showConfirmModal(
        msg,
        ()=>{ startPendingBatch(items); },
        'Dodaj ipak', 'Otkaži', 'create-btn'
      );
      return;
    }
    startPendingBatch(items);
  }
}
async function handleIncomingText(text){
  if(!text || !text.trim()) return;
  await handleIncomingItems(()=>parseWithAI(text));
}
async function handleIncomingImage(){
  if(!selectedPhoto) return;
  const photo = selectedPhoto;
  const captionInp = document.getElementById('manualInput');
  const caption = captionInp ? captionInp.value : '';
  selectedPhoto = null;
  if(captionInp) captionInp.value = '';
  await handleIncomingItems(()=>parseImageWithAI(photo.dataUrl, caption));
}

/* ---------- PENDING CONFIRM ---------- */
function startPendingSingle(item){
  clearInterval(pendingTimer); pendingItems=[item]; pendingPct=0; render();
  const duration=5000, stepMs=50; let elapsed=0;
  pendingTimer = setInterval(()=>{
    elapsed+=stepMs; pendingPct=Math.min(100,(elapsed/duration)*100);
    const ring=document.querySelector('.countdown'); if(ring) ring.style.setProperty('--pct',pendingPct+'%');
    if(elapsed>=duration){ clearInterval(pendingTimer); confirmPending(); }
  }, stepMs);
}
function startPendingBatch(items){ clearInterval(pendingTimer); pendingItems=items; pendingPct=-1; render(); }
function refocusInput(){
  const inp = document.getElementById('manualInput');
  if(inp) inp.focus();
}
function cancelPending(){ clearInterval(pendingTimer); pendingItems=null; render(); refocusInput(); }
function confirmPending(){
  clearInterval(pendingTimer); if(!pendingItems) return;
  const items=pendingItems; pendingItems=null;
  const newIds = commitEntries(items);
  refocusInput();
  scrollToEntry(newIds[newIds.length-1]);
}
function scrollToEntry(id){
  setTimeout(()=>{
    const row = document.getElementById('entry-'+id);
    if(!row) return;
    const bottomBar = document.querySelector('.bottom-bar');
    const bottomBarHeight = bottomBar ? bottomBar.offsetHeight : 0;
    const rowRect = row.getBoundingClientRect();
    const targetY = window.scrollY + rowRect.bottom - (window.innerHeight - bottomBarHeight) + 14;
    window.scrollTo({ top: Math.max(0, targetY), behavior: 'smooth' });
  }, 80);
}
function editPendingField(idx, field, value){
  if(!pendingItems) return;
  if(field==='iznos') value = parseFloat(value)||0;
  pendingItems[idx][field]=value;
  if(pendingPct>=0 && pendingPct<100){ clearInterval(pendingTimer); pendingPct=100; }
}
function removeBatchItem(idx){
  if(!pendingItems) return;
  pendingItems.splice(idx,1);
  if(pendingItems.length===0) pendingItems=null;
  render();
  refocusInput();
}
async function submitManualText(){
  if(selectedPhoto){
    await handleIncomingImage();
    const inp2 = document.getElementById('manualInput');
    if(inp2) inp2.focus();
    return;
  }
  const inp=document.getElementById('manualInput');
  const text=inp.value.trim();
  if(!text) return;
  inp.value='';
  inp.focus();
  await handleIncomingText(text);
  const inp2 = document.getElementById('manualInput');
  if(inp2) inp2.focus();
}

/* ---------- GROUPING ---------- */
function groupByDate(){
  const sorted=[...entries].sort((a,b)=>a.datum.localeCompare(b.datum));
  const groups={}; sorted.forEach(e=>{ (groups[e.datum]=groups[e.datum]||[]).push(e); }); return groups;
}
function groupByCategory(){
  const groups={};
  entries.forEach(e=>{ const k=e.kategorija||'Ostalo'; (groups[k]=groups[k]||[]).push(e); });
  return groups;
}
function groupByName(){
  const groups={};
  entries.forEach(e=>{ const k=(e.opis||'').trim() || t('no_description_group'); (groups[k]=groups[k]||[]).push(e); });
  return groups;
}

/* ---------- RENDER ---------- */
function render(){
  const app = document.getElementById('app');
  const proj = currentProject() || {name:'—', activeDate: todayISO()};
  const dispCur = displayCurrency();
  const used = usedCurrencies();
  const otherCurrencies = used.filter(c=>c!==dispCur);

  const groups = viewMode==='datum' ? groupByDate() : (viewMode==='kategorija' ? groupByCategory() : groupByName());
  const groupKeys = Object.keys(groups);
  let grandTotal = entries.reduce((s,e)=>{ const c=convert(e.iznos,e.valuta,dispCur); return s+(c||0); },0);

  const searchActive = searchOpen && searchQuery.trim().length>0;
  const searchQ = foldDiacritics(searchQuery.trim());

  let listHtml = '';
  if(groupKeys.length===0){
    listHtml = '<div class="empty">'+t('empty_project')+'<br>'+t('empty_project_hint')+'</div>';
  } else {
    listHtml = groupKeys.map(key=>{
      let items = groups[key];
      if(searchActive){
        items = items.filter(e =>
          (e.opis && foldDiacritics(e.opis).includes(searchQ)) ||
          (e.kategorija && foldDiacritics(e.kategorija).includes(searchQ)) ||
          (e.napomena && foldDiacritics(e.napomena).includes(searchQ))
        );
      }
      if(searchActive && items.length===0) return '';
      let groupTotal = 0;
      const rows = items.map(e=>{
        const conv = convert(e.iznos, e.valuta, dispCur);
        if(conv!==null) groupTotal += conv;
        let mainText, subText;
        if(e.valuta === dispCur){
          mainText = fmtAmt(e.iznos)+' '+e.valuta;
          subText = '';
        } else if(conv !== null){
          mainText = fmtAmt(conv)+' '+dispCur;
          subText = '= '+fmtAmt(e.iznos)+' '+e.valuta;
        } else {
          mainText = fmtAmt(e.iznos)+' '+e.valuta;
          subText = t('exchange_rate_unknown');
        }
        let metaLine;
        if(viewMode==='datum') metaLine = e.kategorija||'';
        else if(viewMode==='kategorija') metaLine = dmFromISO(e.datum);
        else metaLine = [dmFromISO(e.datum), e.kategorija].filter(Boolean).join(' · ');
        const extra = [metaLine, e.napomena].filter(Boolean).join(' · ');
        return '<tr id="entry-'+e.id+'" onclick="openEditEntry(\''+e.id+'\')">'+
          '<td class="col-opis">'+escapeHtml(e.opis)+(extra?('<span class="meta">'+escapeHtml(extra)+'</span>'):'')+'</td>'+
          '<td class="col-amt num">'+mainText+(subText?('<span class="sub num">'+subText+'</span>'):'')+'</td></tr>';
      }).join('');
      const label = viewMode==='datum' ? dmFromISO(key) : key;
      return '<div class="group-block"><div class="group-head">'+escapeHtml(label)+'</div>'+
        '<table class="entries-table"><tbody>'+rows+
        '<tr class="total-row"><td>'+t('total')+'</td><td class="col-amt num">'+fmtAmt(groupTotal)+' '+dispCur+'</td></tr>'+
        '</tbody></table></div>';
    }).join('');
    if(searchActive && listHtml.trim()===''){
      listHtml = '<div class="empty">'+t('no_search_results')+' "'+escapeHtml(searchQuery)+'".</div>';
    }
  }

  const curToggleHtml = used.length>1 ? (
    '<div class="cur-toggle">'+
    used.map(c=>'<button class="'+(c===dispCur?'active':'')+'" onclick="setDisplayCurrency(\''+c+'\')">'+c+'</button>').join('')+
    '</div>'
  ) : '';

  const rateBarHtml = otherCurrencies.length>0 ? (
    otherCurrencies.map(c=>
      '<div class="rate-icon-btn" onclick="openRateModal(\''+c+'\',\''+dispCur+'\')" title="1 '+c+' = '+(rates[pairKey(c,dispCur)] ? fmtNum(convert(1,c,dispCur)) : '?')+' '+dispCur+'">'+
      '<span class="ri-ic">'+c+'</span>'+
      '<span class="ri-val">'+(rates[pairKey(c,dispCur)] ? Math.round(convert(1,c,dispCur)) : '?')+'</span></div>'

    curToggleHtml+
    '<button class="icon-btn" onclick="openCurrencyPairModal()" title="Izaberi valute" style="font-size:14px;">&#8646;</button>'
  ) : '';

  let pendingHtml = '';
  if(pendingItems){
    if(pendingPct>=0){
      const it = pendingItems[0];
      pendingHtml = '<div class="pending-card">'+
        '<div class="row">'+
        '<input class="f-opis" value="'+escapeHtml(it.opis)+'" oninput="editPendingField(0,\'opis\',this.value)">'+
        '<input class="f-iznos" type="number" step="0.01" value="'+it.iznos+'" oninput="editPendingField(0,\'iznos\',this.value)">'+

        '</div><div class="pending-actions">'+

    } else {
      pendingHtml = '<div class="pending-card">'+

        pendingItems.map((it,idx)=>{
          const dup = findDuplicateEntry(it);
          const dupWarning = dup ? ('<div style="font-size:10.5px;color:var(--coral);font-weight:700;margin:-3px 0 6px;">⚠ '+t('duplicate_exists')+' "'+escapeHtml(dup.opis)+' '+fmtNum(dup.iznos)+' '+dup.valuta+'" '+t('on_date')+' '+dmFromISO(dup.datum)+' - '+t('possible_duplicate')+'</div>') : '';
          return dupWarning +
          '<div class="row">'+

          '<input class="f-iznos" type="number" step="0.01" value="'+it.iznos+'" oninput="editPendingField('+idx+',\'iznos\',this.value)">'+
          '<input class="f-valuta" value="'+it.valuta+'" oninput="editPendingField('+idx+',\'valuta\',this.value.toUpperCase())">'+

        '<button class="btn-save" onclick="confirmPending()">'+t('save_all')+' ('+pendingItems.length+')</button>'+
        '</div></div>';
    }
  }

  app.innerHTML =
    '<div class="topbar">'+
    '<div class="tb-row">'+
    '<div class="project-switch" style="flex:1;" onclick="openProjectSwitcher()">'+
    '<span class="name">'+escapeHtml(proj.name)+'</span>'+
    '<span class="proj-date-inline" onclick="event.stopPropagation(); openDateModal();">'+dmyFromISO(proj.activeDate)+'</span>'+
    '<span class="chev">▾</span>'+
    '</div>'+
    '<button class="icon-btn" onclick="openNewProjectForm()" title="'+t('new_project')+'">➕</button>'+
    '<button class="icon-btn" onclick="toggleSearch()" title="'+t('search')+'">'+(searchOpen?'✕':'🔍')+'</button>'+
    '<button class="icon-btn" onclick="openProjectSettings()" title="'+t('settings')+'">⚙</button>'+
    '</div>'+
    (searchOpen ? '<div class="search-row"><input type="text" id="searchInput" value="'+escapeHtml(searchQuery)+'" placeholder="'+t('search_placeholder')+'" oninput="setSearchQuery(this.value)"><button class="search-close-btn" onclick="toggleSearch()">✕</button></div>' : '')+
    '<div class="tb-row" style="margin-top:7px;">'+
    '<div class="rate-row">'+rateBarHtml+
    '<div class="view-toggle" style="flex:1;">'+
    '<button class="'+(viewMode==='datum'?'active':'')+'" onclick="setViewMode(\'datum\')">'+t('date')+'</button>'+
    '<button class="'+(viewMode==='kategorija'?'active':'')+'" onclick="setViewMode(\'kategorija\')">'+t('category')+'</button>'+
    '<button class="'+(viewMode==='naziv'?'active':'')+'" onclick="setViewMode(\'naziv\')">'+t('view_by_name')+'</button>'+
    '</div></div></div>'+
    '<div class="tb-row" style="margin-top:7px;">'+
    (groupKeys.length>0 ? ('<div class="tr2-total"><span class="tr2-label">'+entries.length+' '+t('items_short')+'</span><span class="tr2-val num">'+fmtAmt(grandTotal)+' '+(dispCur||'')+'</span></div>') : '')+
    '</div>'+
    '</div>'+
    '<div class="list-area">'+listHtml+
    '</div>'+
    '<div class="bottom-bar">'+pendingHtml+
    (selectedPhoto ? ('<div class="photo-preview-row"><img src="'+selectedPhoto.dataUrl+'"><span class="pp-name">'+t('photo_selected')+': '+escapeHtml(selectedPhoto.name)+'</span><button class="pp-remove" onclick="clearSelectedPhoto()">✕ '+t('remove_photo')+'</button></div>') : '')+

let projectSearchQuery = '';
let selectMode = false;
let selectedProjectIds = new Set();
let longPressTimer = null;
let longPressFired = false;
function renderProjectList(){
  const q = projectSearchQuery.trim().toLowerCase();
  const filtered = q ? projects.filter(p=>p.name.toLowerCase().includes(q)) : projects;
  const list = document.getElementById('projListArea');

    return;
  }

    const sel = selectedProjectIds.has(p.id);

    const createdStr = p.createdAt ? dmyFromTimestamp(p.createdAt) : '';
    return '<div class="proj-item '+(p.id===currentProjectId && !selectMode?'active':'')+'" onclick="handleProjectRowClick(\''+p.id+'\')" ontouchstart="startLongPress(\''+p.id+'\')" ontouchend="cancelLongPress()" ontouchmove="cancelLongPress()">'+checkbox+'<div style="display:flex; flex-direction:column; min-width:0;"><span class="pname">'+escapeHtml(p.name)+'</span>'+(createdStr?('<span style="font-size:10.5px; color:var(--text-dim); margin-top:2px;">'+t('created_on')+' '+createdStr+'</span>'):'')+'</div></div>';
  }).join('');
}
function startLongPress(pid){
  longPressFired = false;
  clearTimeout(longPressTimer);
  longPressTimer = setTimeout(()=>{
    longPressFired = true;
    if(!selectMode){ selectMode = true; selectedProjectIds = new Set(); }
    if(selectedProjectIds.has(pid)) selectedProjectIds.delete(pid); else selectedProjectIds.add(pid);
    renderProjectList();
    renderProjectSelectionBar();
    if(navigator.vibrate) navigator.vibrate(30);
  }, 500);
}
function cancelLongPress(){ clearTimeout(longPressTimer); }
function handleProjectRowClick(pid){
  if(longPressFired){ longPressFired = false; return; }
  if(selectMode){
    if(selectedProjectIds.has(pid)) selectedProjectIds.delete(pid); else selectedProjectIds.add(pid);
    renderProjectList();
    renderProjectSelectionBar();
    return;
  }
  switchProject(pid);
}
function exitSelectMode(){
  selectMode = false; selectedProjectIds = new Set();
  renderProjectList();
  renderProjectSelectionBar();
}
function renderProjectSelectionBar(){
  const bar = document.getElementById('projSelectBar');
  if(!bar) return;
  if(!selectMode){ bar.innerHTML = ''; return; }
  const n = selectedProjectIds.size;
  bar.innerHTML = '<div style="display:flex;align-items:center;gap:7px;background:var(--bg-card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:10px;">'+
    '<span style="flex:1;font-size:12.5px;font-weight:700;color:var(--blue-deep);">'+n+' '+t('selected')+'</span>'+
    '<button onclick="exportSelectedProjects()" '+(n===0?'disabled':'')+' style="border:1px solid var(--blue-deep);background:#fff;color:var(--blue-deep);border-radius:8px;padding:6px 9px;font-size:11.5px;font-weight:700;cursor:pointer;">⬇ '+t('export_short')+'</button>'+
    '<button onclick="confirmDeleteSelectedProjects()" '+(n===0?'disabled':'')+' style="border:1px solid var(--coral);background:var(--coral);color:#fff;border-radius:8px;padding:6px 9px;font-size:11.5px;font-weight:700;cursor:pointer;">🗑 '+t('delete_short')+'</button>'+
    '<button onclick="exitSelectMode()" style="border:none;background:none;color:var(--text-dim);font-size:16px;padding:2px 4px;cursor:pointer;">✕</button>'+
    '</div>';
}
function exportSelectedProjects(){
  const ids = Array.from(selectedProjectIds);
  if(ids.length===0) return;
  const selProjects = projects.filter(p=>ids.includes(p.id));
  const backup = { version:1, exportedAt: new Date().toISOString(), projects: selProjects, data: {} };
  selProjects.forEach(p=>{
    const e = lsGet('entries:'+p.id);
    const r = lsGet('rates:'+p.id);
    backup.data[p.id] = {
      entries: (e && e.value) ? JSON.parse(e.value) : [],
      rates: (r && r.value) ? JSON.parse(r.value) : {}
    };
  });
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'troskovi-izabrani-'+todayISO()+'.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  showBanner(t('exported_projects')+' '+ids.length+' '+t('projects_word')+'.', 'info');
}
function confirmDeleteSelectedProjects(){
  const n = selectedProjectIds.size;
  if(n===0) return;
  showConfirmModal(t('confirm_delete_projects')+' '+n+' '+t('confirm_delete_projects_end'), ()=>{
    const idsToDelete = Array.from(selectedProjectIds);
    idsToDelete.forEach(pid=>{ lsDelete('entries:'+pid); lsDelete('rates:'+pid); });
    const wasCurrentDeleted = idsToDelete.includes(currentProjectId);
    projects = projects.filter(p=>!idsToDelete.includes(p.id));
    persistProjects();
    selectMode = false; selectedProjectIds = new Set();
    if(projects.length===0){ createProject(null,'auto'); }
    else if(wasCurrentDeleted){ switchProject(projects[0].id); }
    else { renderProjectList(); renderProjectSelectionBar(); }
    showBanner(n+' '+t('projects_deleted'), 'info');
  }, t('default_yes_delete'), t('cancel'), 'delete-btn');
}

function handleImportFile(fileInput){
  const file = fileInput.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    let backup;
    try{ backup = JSON.parse(e.target.result); }
    catch(err){ showBanner(t('file_not_valid_json')); return; }
    if(!backup || !Array.isArray(backup.projects)){ showBanner(t('file_not_valid_backup')); return; }
    const count = backup.projects.length;
    showConfirmModal(t('backup_will_replace')+' ('+count+' '+t('backup_will_replace_mid')+' '+(backup.exportedAt?backup.exportedAt.slice(0,10):t('backup_unknown_date'))+'). '+t('backup_current_lost'), ()=>{
      applyBackup(backup);
    });
  };
  reader.readAsText(file);
  fileInput.value = '';
}
function applyBackup(backup){
  projects = backup.projects;
  persistProjects();
  Object.keys(backup.data||{}).forEach(pid=>{
    lsSet('entries:'+pid, JSON.stringify(backup.data[pid].entries||[]));
    lsSet('rates:'+pid, JSON.stringify(backup.data[pid].rates||{}));
  });
  if(projects.length>0){
    currentProjectId = projects[0].id;
    persistLastProject();
    loadProjectData(currentProjectId);
  }
  closeModal();
  render();

function appendModalBackdrop(backdrop){
  document.body.appendChild(backdrop);
  document.body.style.overflow = 'hidden';
  try{ history.pushState({modalOpen:true}, '', location.href); }catch(e){}
}
function releaseScrollLockIfNoModals(){
  const anyOpen = document.getElementById('modalBackdrop') || document.getElementById('confirmBackdrop');
  if(!anyOpen){ document.body.style.overflow = ''; }
}
function closeModal(){
  const b=document.getElementById('modalBackdrop');
  if(b) b.remove();
  releaseScrollLockIfNoModals();
}
window.addEventListener('popstate', function(){
  const m = document.getElementById('modalBackdrop'); if(m) m.remove();
  const c = document.getElementById('confirmBackdrop'); if(c) c.remove();
  if(searchOpen){ searchOpen = false; searchQuery=''; render(); }
  releaseScrollLockIfNoModals();
});
let __confirmYesAction = null;
function showConfirmModal(message, onYes, yesLabel, noLabel, yesClass){
  __confirmYesAction = onYes;
  yesLabel = yesLabel || t('default_yes_delete');
  noLabel = noLabel || t('no');
  yesClass = yesClass || 'delete-btn';
  const backdrop=document.createElement('div'); backdrop.className='modal-backdrop small-modal'; backdrop.id='confirmBackdrop';
  backdrop.innerHTML = '<div class="modal"><button class="modal-close-x" onclick="closeConfirmModal()">✕</button><h2>'+t('confirm_title')+'</h2>'+
    '<p style="font-size:14.5px; color:var(--text); line-height:1.5; margin:0 0 20px;">'+escapeHtml(message)+'</p>'+
    '<div class="modal-actions">'+
    '<button class="cancel-btn" onclick="closeConfirmModal()">'+escapeHtml(noLabel)+'</button>'+
    '<button class="'+yesClass+'" onclick="runConfirmYes()">'+escapeHtml(yesLabel)+'</button>'+
    '</div></div>';
  appendModalBackdrop(backdrop);
  backdrop.addEventListener('click',(e)=>{ if(e.target===backdrop) closeConfirmModal(); });
}
function closeConfirmModal(){
  const b=document.getElementById('confirmBackdrop');
  if(b) b.remove();
  __confirmYesAction=null;
  releaseScrollLockIfNoModals();
}
function runConfirmYes(){ const fn=__confirmYesAction; closeConfirmModal(); if(fn) fn(); }

/* ---------- EXPORT ---------- */
function exportXlsx(){
  if(entries.length===0){ showBanner(t('no_items_to_export')); return; }
  const proj = currentProject();
  const dispCur = displayCurrency();
  const groups = groupByDate();
  const dates = Object.keys(groups);
  const aoa = [];
  aoa.push([proj.name]);
  aoa.push([]);
  aoa.push(['Datum','Opis','Kategorija','Iznos','Valuta','Iznos u '+dispCur,'Napomena']);
  let grand = 0;
  dates.forEach(date=>{
    const items = groups[date];
    let dayTotal = 0;
    items.forEach(e=>{
      const conv = convert(e.iznos, e.valuta, dispCur);
      if(conv!==null) dayTotal += conv;
      aoa.push([dmFromISO(e.datum), e.opis, e.kategorija||'', e.iznos, e.valuta, conv!==null?Math.round(conv*100)/100:'', e.napomena||'']);
    });
    aoa.push(['', 'Ukupno '+dmFromISO(date), '', '', '', Math.round(dayTotal*100)/100, '']);
    aoa.push([]);
    grand += dayTotal;
  });
  aoa.push(['', 'UKUPNO PROJEKAT', '', '', '', Math.round(grand*100)/100, '']);

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:8},{wch:30},{wch:14},{wch:10},{wch:8},{wch:14},{wch:28}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, proj.name.slice(0,28) || 'Troskovi');
  const fname = (proj.name||'troskovi').replace(/[^\w]+/g,'_')+'_'+todayISO()+'.xlsx';
  XLSX.writeFile(wb, fname);
  showBanner('Excel fajl "'+fname+'" '+t('excel_downloading'), 'info');
}
